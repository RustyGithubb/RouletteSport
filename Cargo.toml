[package]
name = "roulette-sport"
version = "0.1.0"
edition = "2021"
description = "Roulette d'exercices de sport facon loto"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
